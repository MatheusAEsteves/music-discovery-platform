spring.application.name=music-discovery-platform

# Configuração do banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/music_discovery
spring.datasource.username=root
spring.datasource.password=root

# Configuração do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Mostra as queries na console
spring.jpa.properties.hibernate.jdbc.lob.non_contextual-creation=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#==============================
# Flyway
# ==============================
# o Flyway cria uma baseline e passa a controlar as próximas versões.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
